name: golangci-lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run ./...

        with:
          version: v1.55.2
          args: --timeout=5m